<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="470" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- ===== Panel 1: Deduplication ===== -->
  <text x="30" y="42" font-size="19" font-weight="700" fill="#1f2328">1 &#183; Event deduplication &#8212; one purchase, one conversion</text>

  <!-- Browser box -->
  <rect x="30" y="70" width="200" height="64" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="130" y="96" font-size="14" font-weight="600" fill="#0969da" text-anchor="middle">Browser (Meta Pixel)</text>
  <text x="130" y="116" font-size="12" fill="#57606a" text-anchor="middle">event_id: abc123</text>

  <!-- Server box -->
  <rect x="30" y="160" width="200" height="64" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="130" y="186" font-size="14" font-weight="600" fill="#1a7f37" text-anchor="middle">Your server (this lib)</text>
  <text x="130" y="206" font-size="12" fill="#57606a" text-anchor="middle">event_id: abc123</text>

  <!-- Meta box -->
  <rect x="430" y="115" width="170" height="64" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="515" y="141" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Meta</text>
  <text x="515" y="161" font-size="12" fill="#57606a" text-anchor="middle">deduplicates on event_id</text>

  <!-- Result box -->
  <rect x="680" y="115" width="210" height="64" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="785" y="141" font-size="13" font-weight="600" fill="#7d4e00" text-anchor="middle">1 conversion reported</text>
  <text x="785" y="161" font-size="12" fill="#7d4e00" text-anchor="middle">retries idempotent, no double count</text>

  <!-- Arrows panel 1 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <line x1="230" y1="102" x2="424" y2="138" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="192" x2="424" y2="158" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="147" x2="674" y2="147" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="105" font-size="12" fill="#57606a">Pixel event</text>
  <text x="320" y="195" font-size="12" fill="#57606a">CAPI event</text>

  <!-- divider -->
  <line x1="30" y1="255" x2="890" y2="255" stroke="#d0d7de" stroke-dasharray="6 6"/>

  <!-- ===== Panel 2: PII boundary ===== -->
  <text x="30" y="292" font-size="19" font-weight="700" fill="#1f2328">2 &#183; GDPR hash-at-the-boundary &#8212; plaintext PII never leaves one function</text>

  <!-- Raw PII -->
  <rect x="30" y="320" width="150" height="60" rx="8" fill="#ffebe9" stroke="#ff8182"/>
  <text x="105" y="346" font-size="13" font-weight="600" fill="#cf222e" text-anchor="middle">Raw PII</text>
  <text x="105" y="364" font-size="11" fill="#82071e" text-anchor="middle">email, phone, postcode</text>

  <!-- Boundary -->
  <rect x="250" y="312" width="230" height="76" rx="8" fill="#fbefff" stroke="#c297ff"/>
  <text x="365" y="338" font-size="13" font-weight="600" fill="#8250df" text-anchor="middle">UserData.from_raw()</text>
  <text x="365" y="356" font-size="11" fill="#6639ba" text-anchor="middle">normalise per Meta spec,</text>
  <text x="365" y="372" font-size="11" fill="#6639ba" text-anchor="middle">then SHA-256 &#8212; only plaintext site</text>

  <!-- Payload -->
  <rect x="550" y="320" width="160" height="60" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="630" y="346" font-size="13" font-weight="600" fill="#1a7f37" text-anchor="middle">Hashed payload</text>
  <text x="630" y="364" font-size="11" fill="#116329" text-anchor="middle">unset fields omitted</text>

  <!-- Meta -->
  <rect x="780" y="320" width="110" height="60" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="835" y="355" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">Meta</text>

  <!-- Logs -->
  <rect x="250" y="412" width="460" height="40" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="480" y="437" font-size="12" fill="#57606a" text-anchor="middle">Logs: truncated event_ids, counts, fbtrace_id &#8212; never customer data</text>

  <!-- Arrows panel 2 -->
  <line x1="180" y1="350" x2="244" y2="350" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="350" x2="544" y2="350" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="350" x2="774" y2="350" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="365" y1="388" x2="365" y2="406" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
